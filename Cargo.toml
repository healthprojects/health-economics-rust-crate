[package]
name = "health-economics"
version = "1.0.4"
edition = "2024"
rust-version = "1.98"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "Health economics models, structs, calculations, and examples."
readme = "README.md"
repository = "https://github.com/healthprojects/health-economics-rust-crate/"
documentation = "https://docs.rs/health-economics"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
keywords = ["health", "economics", "statistics", "analytics", "medical"]
categories = ["science", "data-structures", "finance"]
include = [
    "src/**/*",
    "spec/**/*",
    "docs/tutorials/**/*",
    "docs/adr/**/*",
    "docs/case-studies/**/*",
    "docs/community/**/*",
    "docs/notebooks/**/*",
    "docs/architecture.md",
    "docs/comparisons.md",
    "docs/cheat-sheet.md",
    "docs/course-curriculum.md",
    "docs/blog-series.md",
    "docs/data-flow.md",
    "docs/dependency-graph.md",
    "docs/getting-started.md",
    "docs/migration.md",
    "docs/project-metrics.md",
    "docs/podcast-outline.md",
    "docs/talk-outline.md",
    "docs/workshop.md",
    "docs/video-tutorial-outline.md",
    "docs/SUMMARY.md",
    "docs/audits/security-checklist.md",
    "docs/audits/mistral-medium-3-5-high/disposition.md",
    "docs/audits/mistral-medium-3-5-high/task-status.md",
    "benches/**/*",
    "book.toml",
    "examples/**/*",
    "tests/**/*",
    "assets/**/*",
    "data/**/*",
    "health-economics-skill/**/*",
    "CHANGELOG.md",
    "FAQ.md",
    "GLOSSARY.md",
    "MAINTAINERS.md",
    "RELEASING.md",
    "REVIEW.md",
    "ROADMAP.md",
    "LICENSE.md",
    "README.md",
    "SECURITY.md",
    "AGENTS.md",
    "CLAUDE.md",
    "llms.txt",
    "llms.json",
]

[dependencies]
rust_decimal = { version = "1.43.0", default-features = false, features = ["std"] }
rusty-money = "0.5.1"

[lints.rust]
missing_docs = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
assert_is_empty = "allow"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

# cargo-mutants builds every mutant once in a throwaway copy of the tree: no debug information and no
# incremental state make each build quicker and smaller. `.cargo/mutants.toml` selects it.
[profile.mutants]
inherits = "test"
debug = "none"
incremental = false

[[bench]]
name = "core"
harness = false
